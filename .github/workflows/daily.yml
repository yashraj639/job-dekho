name: daily-job-scan

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time. A second trigger waits instead of cancelling, so a run is
# never killed halfway through sending messages or writing state.
concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run src/index.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          DISCOVERY_PROVIDER: groq
          DISCOVERY_ONLY: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit state
        run: |
          git config user.name "job-dekho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
