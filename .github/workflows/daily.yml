name: daily-job-scan

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time. A second trigger waits instead of cancelling, so a run is
# never killed halfway through sending messages or writing state.
concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real resume is gitignored and never committed. It is written at
      # runtime from the RESUME_MD secret. An empty secret fails fast below
      # when the pipeline refuses to run with an empty resume.
      - name: Materialize resume from secret
        env:
          RESUME_MD: ${{ secrets.RESUME_MD }}
        run: |
          printf '%s' "$RESUME_MD" > config/resume.md
          test -s config/resume.md

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run src/index.ts
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          # `||` matters here: an unset repository variable resolves to an empty
          # string, which would override the code default instead of falling
          # back to it.
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit state
        run: |
          git config user.name "job-dekho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
